name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-check:
    name: Architecture Check (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [beopdong-admin, gujeuk-admin, gujeuk-check-in]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-yarn
      - name: Run architecture check
        run: yarn workspace @gujeuk/${{ matrix.app }} architecture:check

  type-check:
    name: Type Check (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [beopdong-admin, gujeuk-admin, gujeuk-check-in]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-yarn
      - name: Run type check
        run: yarn workspace @gujeuk/${{ matrix.app }} typecheck

  lint:
    name: ES Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [beopdong-admin, gujeuk-admin, gujeuk-check-in]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-yarn
      - name: Run ES Lint
        run: yarn workspace @gujeuk/${{ matrix.app }} lint

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [beopdong-admin, gujeuk-admin, gujeuk-check-in]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-yarn
      - name: Run build
        run: yarn workspace @gujeuk/${{ matrix.app }} build

  admin-shared:
    name: Admin Shared Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-yarn
      - name: Check shared package lint and types
        run: yarn check:admin-shared

  type-check-required:
    name: Type Check
    needs: [type-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all app type checks to succeed
        env:
          RESULT: ${{ needs.type-check.result }}
        run: test "$RESULT" = "success"

  lint-required:
    name: ES Lint
    needs: [lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all app lint checks to succeed
        env:
          RESULT: ${{ needs.lint.result }}
        run: test "$RESULT" = "success"

  build-required:
    name: Build
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all app builds to succeed
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = "success"
